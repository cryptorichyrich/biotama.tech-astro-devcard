<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0f172a"/>
      <stop offset="50%" style="stop-color:#1e293b"/>
      <stop offset="100%" style="stop-color:#0f172a"/>
    </linearGradient>
    <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#22d3ee"/>
      <stop offset="100%" style="stop-color:#6366f1"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="630" fill="url(#bg)"/>
  <!-- Grid pattern -->
  <g opacity="0.05" stroke="#22d3ee" stroke-width="1">
    <line x1="0" y1="0" x2="0" y2="630"/><line x1="60" y1="0" x2="60" y2="630"/>
    <line x1="120" y1="0" x2="120" y2="630"/><line x1="180" y1="0" x2="180" y2="630"/>
    <line x1="240" y1="0" x2="240" y2="630"/><line x1="300" y1="0" x2="300" y2="630"/>
    <line x1="360" y1="0" x2="360" y2="630"/><line x1="420" y1="0" x2="420" y2="630"/>
    <line x1="480" y1="0" x2="480" y2="630"/><line x1="540" y1="0" x2="540" y2="630"/>
    <line x1="600" y1="0" x2="600" y2="630"/><line x1="660" y1="0" x2="660" y2="630"/>
    <line x1="720" y1="0" x2="720" y2="630"/><line x1="780" y1="0" x2="780" y2="630"/>
    <line x1="840" y1="0" x2="840" y2="630"/><line x1="900" y1="0" x2="900" y2="630"/>
    <line x1="960" y1="0" x2="960" y2="630"/><line x1="1020" y1="0" x2="1020" y2="630"/>
    <line x1="1080" y1="0" x2="1080" y2="630"/><line x1="1140" y1="0" x2="1140" y2="630"/>
    <line x1="1200" y1="0" x2="1200" y2="630"/>
  </g>
  <!-- Accent line -->
  <rect x="100" y="220" width="80" height="4" rx="2" fill="url(#accent)"/>
  <!-- Key icon -->
  <g transform="translate(100, 260)" fill="none" stroke="#22d3ee" stroke-width="2" opacity="0.6">
    <circle cx="16" cy="16" r="10"/>
    <line x1="24" y1="8" x2="60" y2="8"/>
    <line x1="48" y1="8" x2="48" y2="18"/>
    <line x1="60" y1="8" x2="60" y2="18"/>
  </g>
  <!-- Title -->
  <text x="100" y="360" font-family="system-ui, -apple-system, sans-serif" font-size="42" font-weight="700" fill="#f8fafc">
    Idempotent Payment
  </text>
  <text x="100" y="415" font-family="system-ui, -apple-system, sans-serif" font-size="42" font-weight="700" fill="#f8fafc">
    Endpoints
  </text>
  <!-- Subtitle -->
  <text x="100" y="470" font-family="system-ui, -apple-system, sans-serif" font-size="20" fill="#94a3b8">
    Lessons from production payment integrations
  </text>
  <!-- Tags -->
  <rect x="100" y="510" width="70" height="28" rx="14" fill="rgba(34,211,238,0.15)" stroke="#22d3ee" stroke-width="1"/>
  <text x="135" y="529" font-family="system-ui, sans-serif" font-size="13" fill="#22d3ee" text-anchor="middle">fintech</text>
  <rect x="180" y="510" width="80" height="28" rx="14" fill="rgba(99,102,241,0.15)" stroke="#6366f1" stroke-width="1"/>
  <text x="220" y="529" font-family="system-ui, sans-serif" font-size="13" fill="#6366f1" text-anchor="middle">payments</text>
  <rect x="270" y="510" width="90" height="28" rx="14" fill="rgba(34,211,238,0.15)" stroke="#22d3ee" stroke-width="1"/>
  <text x="315" y="529" font-family="system-ui, sans-serif" font-size="13" fill="#22d3ee" text-anchor="middle">api-design</text>
  <!-- Right side decorative element: duplicate request flow -->
  <g transform="translate(780, 200)" opacity="0.12">
    <rect x="0" y="0" width="280" height="200" rx="12" fill="none" stroke="#22d3ee" stroke-width="2"/>
    <text x="140" y="40" font-family="monospace" font-size="14" fill="#22d3ee" text-anchor="middle">POST /api/payments</text>
    <text x="140" y="65" font-family="monospace" font-size="13" fill="#6366f1" text-anchor="middle">Idempotency-Key: abc-123</text>
    <line x1="40" y1="85" x2="240" y2="85" stroke="#334155" stroke-width="1"/>
    <text x="140" y="110" font-family="monospace" font-size="13" fill="#94a3b8" text-anchor="middle">→ cache lookup: MISS</text>
    <text x="140" y="135" font-family="monospace" font-size="13" fill="#94a3b8" text-anchor="middle">→ lock key: OK</text>
    <text x="140" y="160" font-family="monospace" font-size="13" fill="#22d3ee" text-anchor="middle">→ process payment</text>
    <text x="140" y="185" font-family="monospace" font-size="13" fill="#22d3ee" text-anchor="middle">→ cache response</text>
  </g>
  <g transform="translate(780, 440)" opacity="0.08">
    <rect x="0" y="0" width="280" height="140" rx="12" fill="none" stroke="#6366f1" stroke-width="2"/>
    <text x="140" y="30" font-family="monospace" font-size="14" fill="#6366f1" text-anchor="middle">POST /api/payments</text>
    <text x="140" y="55" font-family="monospace" font-size="13" fill="#6366f1" text-anchor="middle">Idempotency-Key: abc-123</text>
    <line x1="40" y1="70" x2="240" y2="70" stroke="#334155" stroke-width="1"/>
    <text x="140" y="95" font-family="monospace" font-size="13" fill="#94a3b8" text-anchor="middle">→ cache lookup: HIT</text>
    <text x="140" y="120" font-family="monospace" font-size="13" fill="#22d3ee" text-anchor="middle">→ return cached response</text>
  </g>
  <!-- Author -->
  <text x="1100" y="590" font-family="system-ui, sans-serif" font-size="14" fill="#64748b" text-anchor="end">biotama.cv</text>
</svg>
