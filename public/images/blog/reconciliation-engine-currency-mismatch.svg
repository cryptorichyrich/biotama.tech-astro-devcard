<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0f172a"/>
      <stop offset="50%" style="stop-color:#1e293b"/>
      <stop offset="100%" style="stop-color:#0f172a"/>
    </linearGradient>
    <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#f59e0b"/>
      <stop offset="100%" style="stop-color:#ef4444"/>
    </linearGradient>
    <linearGradient id="glow" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#f59e0b;stop-opacity:0.25"/>
      <stop offset="100%" style="stop-color:#f59e0b;stop-opacity:0"/>
    </linearGradient>
  </defs>
  
  <!-- Background -->
  <rect width="1200" height="630" fill="url(#bg)"/>
  
  <!-- Subtle grid pattern -->
  <g opacity="0.04" stroke="#f59e0b" stroke-width="1">
    <line x1="0" y1="0" x2="1200" y2="0"/><line x1="0" y1="63" x2="1200" y2="63"/>
    <line x1="0" y1="126" x2="1200" y2="126"/><line x1="0" y1="189" x2="1200" y2="189"/>
    <line x1="0" y1="252" x2="1200" y2="252"/><line x1="0" y1="315" x2="1200" y2="315"/>
    <line x1="0" y1="378" x2="1200" y2="378"/><line x1="0" y1="441" x2="1200" y2="441"/>
    <line x1="0" y1="504" x2="1200" y2="504"/><line x1="0" y1="567" x2="1200" y2="567"/>
    <line x1="0" y1="630" x2="1200" y2="630"/>
    <line x1="0" y1="0" x2="0" y2="630"/><line x1="120" y1="0" x2="120" y2="630"/>
    <line x1="240" y1="0" x2="240" y2="630"/><line x1="360" y1="0" x2="360" y2="630"/>
    <line x1="480" y1="0" x2="480" y2="630"/><line x1="600" y1="0" x2="600" y2="630"/>
    <line x1="720" y1="0" x2="720" y2="630"/><line x1="840" y1="0" x2="840" y2="630"/>
    <line x1="960" y1="0" x2="960" y2="630"/><line x1="1080" y1="0" x2="1080" y2="630"/>
    <line x1="1200" y1="0" x2="1200" y2="630"/>
  </g>
  
  <!-- Decorative glow -->
  <ellipse cx="600" cy="260" rx="420" ry="180" fill="url(#glow)" opacity="0.12"/>
  
  <!-- Ledger box (left) -->
  <g transform="translate(200, 180)">
    <rect x="0" y="0" width="140" height="100" rx="8" fill="none" stroke="#3b82f6" stroke-width="2.5" opacity="0.9"/>
    <text x="70" y="38" text-anchor="middle" fill="#93c5fd" font-family="monospace" font-size="13" font-weight="600">LEDGER</text>
    <text x="70" y="60" text-anchor="middle" fill="#64748b" font-family="monospace" font-size="11">IDR 1,584,723</text>
    <text x="70" y="80" text-anchor="middle" fill="#64748b" font-family="monospace" font-size="10">rate: 15,847</text>
  </g>
  
  <!-- Arrow 1 -->
  <g transform="translate(370, 215)">
    <line x1="0" y1="20" x2="100" y2="20" stroke="#f59e0b" stroke-width="2" stroke-dasharray="6,4" opacity="0.7"/>
    <text x="50" y="12" text-anchor="middle" fill="#fbbf24" font-family="monospace" font-size="10">NORMALIZE</text>
  </g>
  
  <!-- Reconciliation engine (center) -->
  <g transform="translate(490, 155)">
    <rect x="0" y="0" width="220" height="140" rx="10" fill="none" stroke="#f59e0b" stroke-width="2.5" opacity="0.9"/>
    <text x="110" y="35" text-anchor="middle" fill="#fcd34d" font-family="monospace" font-size="14" font-weight="700">RECONCILE</text>
    <!-- Threshold indicator -->
    <g transform="translate(20, 50)">
      <rect x="0" y="0" width="180" height="28" rx="4" fill="#f59e0b" fill-opacity="0.1" stroke="#f59e0b" stroke-width="1" opacity="0.5"/>
      <text x="90" y="18" text-anchor="middle" fill="#fbbf24" font-family="monospace" font-size="11">threshold: 0.5% | 5000</text>
    </g>
    <!-- Match result -->
    <g transform="translate(20, 90)">
      <rect x="0" y="0" width="80" height="24" rx="4" fill="#10b981" fill-opacity="0.15" stroke="#10b981" stroke-width="1"/>
      <text x="40" y="16" text-anchor="middle" fill="#6ee7b7" font-family="monospace" font-size="11">MATCHED</text>
      <rect x="95" y="0" width="85" height="24" rx="4" fill="#ef4444" fill-opacity="0.15" stroke="#ef4444" stroke-width="1"/>
      <text x="137" y="16" text-anchor="middle" fill="#fca5a5" font-family="monospace" font-size="11">EXCEPTION</text>
    </g>
  </g>
  
  <!-- Settlement box (right) -->
  <g transform="translate(860, 180)">
    <rect x="0" y="0" width="140" height="100" rx="8" fill="none" stroke="#8b5cf6" stroke-width="2.5" opacity="0.9"/>
    <text x="70" y="38" text-anchor="middle" fill="#c4b5fd" font-family="monospace" font-size="13" font-weight="600">PROVIDER</text>
    <text x="70" y="60" text-anchor="middle" fill="#64748b" font-family="monospace" font-size="11">IDR 1,584,720</text>
    <text x="70" y="80" text-anchor="middle" fill="#64748b" font-family="monospace" font-size="10">rate: 15,847.2</text>
  </g>
  
  <!-- Arrow from settlement to engine -->
  <g transform="translate(830, 215)">
    <line x1="100" y1="20" x2="0" y2="20" stroke="#f59e0b" stroke-width="2" stroke-dasharray="6,4" opacity="0.7"/>
    <text x="50" y="12" text-anchor="middle" fill="#fbbf24" font-family="monospace" font-size="10">NORMALIZE</text>
  </g>
  
  <!-- Variance indicator -->
  <g transform="translate(540, 310)">
    <text x="60" y="0" text-anchor="middle" fill="#94a3b8" font-family="monospace" font-size="11">variance: IDR 3</text>
    <text x="60" y="16" text-anchor="middle" fill="#6ee7b7" font-family="monospace" font-size="10">within threshold ✓</text>
  </g>
  
  <!-- Top accent line -->
  <rect x="0" y="0" width="1200" height="3" fill="url(#accent)"/>
  
  <!-- Title -->
  <text x="600" y="420" text-anchor="middle" fill="#f1f5f9" font-family="'Segoe UI', system-ui, sans-serif" font-size="36" font-weight="700" letter-spacing="-0.5">
    Reconciliation Engine
  </text>
  <text x="600" y="460" text-anchor="middle" fill="#94a3b8" font-family="'Segoe UI', system-ui, sans-serif" font-size="20" font-weight="400">
    Handling Currency Mismatch in Production
  </text>
  
  <!-- Tags -->
  <g transform="translate(400, 490)">
    <rect x="0" y="0" width="70" height="26" rx="13" fill="none" stroke="#f59e0b" stroke-width="1.5" opacity="0.7"/>
    <text x="35" y="17" text-anchor="middle" fill="#fbbf24" font-family="'Segoe UI', system-ui, sans-serif" font-size="12">fintech</text>
    
    <rect x="80" y="0" width="105" height="26" rx="13" fill="none" stroke="#ef4444" stroke-width="1.5" opacity="0.7"/>
    <text x="132" y="17" text-anchor="middle" fill="#fca5a5" font-family="'Segoe UI', system-ui, sans-serif" font-size="12">reconciliation</text>
    
    <rect x="195" y="0" width="90" height="26" rx="13" fill="none" stroke="#3b82f6" stroke-width="1.5" opacity="0.7"/>
    <text x="240" y="17" text-anchor="middle" fill="#60a5fa" font-family="'Segoe UI', system-ui, sans-serif" font-size="12">architecture</text>
  </g>
  
  <!-- Author -->
  <text x="600" y="570" text-anchor="middle" fill="#475569" font-family="'Segoe UI', system-ui, sans-serif" font-size="14">Bio Lumbantoruan</text>
  
  <!-- Bottom accent line -->
  <rect x="0" y="627" width="1200" height="3" fill="url(#accent)"/>
</svg>