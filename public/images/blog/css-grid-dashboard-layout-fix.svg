<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0f172a;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#1e293b;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#38bdf8;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#818cf8;stop-opacity:1" />
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="1200" height="630" fill="url(#bg)" />

  <!-- Grid pattern (subtle) -->
  <g opacity="0.06" stroke="#94a3b8" stroke-width="1">
    <line x1="0" y1="100" x2="1200" y2="100"/>
    <line x1="0" y1="200" x2="1200" y2="200"/>
    <line x1="0" y1="300" x2="1200" y2="300"/>
    <line x1="0" y1="400" x2="1200" y2="400"/>
    <line x1="0" y1="500" x2="1200" y2="500"/>
    <line x1="200" y1="0" x2="200" y2="630"/>
    <line x1="400" y1="0" x2="400" y2="630"/>
    <line x1="600" y1="0" x2="600" y2="630"/>
    <line x1="800" y1="0" x2="800" y2="630"/>
    <line x1="1000" y1="0" x2="1000" y2="630"/>
  </g>

  <!-- Highlighted grid cells -->
  <g opacity="0.15">
    <rect x="100" y="120" width="300" height="160" rx="8" fill="#38bdf8"/>
    <rect x="440" y="120" width="300" height="160" rx="8" fill="#38bdf8"/>
    <rect x="780" y="120" width="300" height="160" rx="8" fill="#38bdf8"/>
    <rect x="100" y="320" width="300" height="160" rx="8" fill="#818cf8"/>
    <rect x="440" y="320" width="300" height="160" rx="8" fill="#818cf8"/>
    <rect x="780" y="320" width="300" height="160" rx="8" fill="#38bdf8"/>
  </g>

  <!-- Code snippet -->
  <rect x="80" y="120" width="1040" height="340" rx="12" fill="#0f172a" fill-opacity="0.0" stroke="#334155" stroke-width="1.5"/>

  <!-- Code text -->
  <text x="120" y="175" font-family="'JetBrains Mono', 'Fira Code', 'Cascadia Code', monospace" font-size="22" fill="#94a3b8">
    <tspan x="120" dy="0">.dashboard-grid {</tspan>
    <tspan x="160" dy="45" fill="#38bdf8">display</tspan><tspan fill="#e2e8f0">: grid;</tspan>
    <tspan x="160" dy="45" fill="#38bdf8">grid-template-columns</tspan><tspan fill="#e2e8f0">: </tspan><tspan fill="#818cf8">repeat</tspan><tspan fill="#e2e8f0">(</tspan><tspan fill="#fb923c">auto-fit</tspan><tspan fill="#e2e8f0">, </tspan><tspan fill="#818cf8">minmax</tspan><tspan fill="#e2e8f0">(</tspan><tspan fill="#fb923c">320px</tspan><tspan fill="#e2e8f0">, </tspan><tspan fill="#fb923c">1fr</tspan><tspan fill="#e2e8f0">));</tspan>
    <tspan x="160" dy="45" fill="#38bdf8">gap</tspan><tspan fill="#e2e8f0">: </tspan><tspan fill="#fb923c">1.5rem</tspan><tspan fill="#e2e8f0">;</tspan>
    <tspan x="120" dy="45" fill="#94a3b8">}</tspan>
  </text>

  <!-- Title at bottom -->
  <text x="600" y="565" font-family="'Inter', 'Segoe UI', system-ui, sans-serif" font-size="28" font-weight="700" fill="#e2e8f0" text-anchor="middle" letter-spacing="-0.5">One CSS Grid Line Fixed Our Entire Dashboard</text>
</svg>
