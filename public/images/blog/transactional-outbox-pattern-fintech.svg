<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0f172a"/>
      <stop offset="50%" style="stop-color:#1e293b"/>
      <stop offset="100%" style="stop-color:#0f172a"/>
    </linearGradient>
    <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#3b82f6"/>
      <stop offset="100%" style="stop-color:#8b5cf6"/>
    </linearGradient>
    <linearGradient id="glow" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#3b82f6;stop-opacity:0.3"/>
      <stop offset="100%" style="stop-color:#3b82f6;stop-opacity:0"/>
    </linearGradient>
  </defs>
  
  <!-- Background -->
  <rect width="1200" height="630" fill="url(#bg)"/>
  
  <!-- Subtle grid pattern -->
  <g opacity="0.05" stroke="#3b82f6" stroke-width="1">
    <line x1="0" y1="0" x2="1200" y2="0"/>
    <line x1="0" y1="63" x2="1200" y2="63"/>
    <line x1="0" y1="126" x2="1200" y2="126"/>
    <line x1="0" y1="189" x2="1200" y2="189"/>
    <line x1="0" y1="252" x2="1200" y2="252"/>
    <line x1="0" y1="315" x2="1200" y2="315"/>
    <line x1="0" y1="378" x2="1200" y2="378"/>
    <line x1="0" y1="441" x2="1200" y2="441"/>
    <line x1="0" y1="504" x2="1200" y2="504"/>
    <line x1="0" y1="567" x2="1200" y2="567"/>
    <line x1="0" y1="630" x2="1200" y2="630"/>
    <line x1="0" y1="0" x2="0" y2="630"/>
    <line x1="120" y1="0" x2="120" y2="630"/>
    <line x1="240" y1="0" x2="240" y2="630"/>
    <line x1="360" y1="0" x2="360" y2="630"/>
    <line x1="480" y1="0" x2="480" y2="630"/>
    <line x1="600" y1="0" x2="600" y2="630"/>
    <line x1="720" y1="0" x2="720" y2="630"/>
    <line x1="840" y1="0" x2="840" y2="630"/>
    <line x1="960" y1="0" x2="960" y2="630"/>
    <line x1="1080" y1="0" x2="1080" y2="630"/>
    <line x1="1200" y1="0" x2="1200" y2="630"/>
  </g>
  
  <!-- Decorative glow -->
  <ellipse cx="600" cy="315" rx="400" ry="200" fill="url(#glow)" opacity="0.15"/>
  
  <!-- Database icon -->
  <g transform="translate(280, 200)">
    <ellipse cx="50" cy="20" rx="50" ry="18" fill="none" stroke="#3b82f6" stroke-width="2.5" opacity="0.9"/>
    <path d="M0,20 L0,100 Q50,130 100,100 L100,20" fill="none" stroke="#3b82f6" stroke-width="2.5" opacity="0.9"/>
    <ellipse cx="50" cy="100" rx="50" ry="18" fill="none" stroke="#3b82f6" stroke-width="2.5" opacity="0.9"/>
    <text x="50" y="65" text-anchor="middle" fill="#93c5fd" font-family="monospace" font-size="14" font-weight="600">DB</text>
  </g>
  
  <!-- Arrow -->
  <g transform="translate(420, 240)">
    <line x1="0" y1="20" x2="80" y2="20" stroke="url(#accent)" stroke-width="2.5"/>
    <polygon points="80,12 96,20 80,28" fill="#8b5cf6"/>
    <text x="48" y="10" text-anchor="middle" fill="#94a3b8" font-family="monospace" font-size="11">TXN</text>
  </g>
  
  <!-- Outbox box -->
  <g transform="translate(530, 200)">
    <rect x="0" y="0" width="120" height="100" rx="8" fill="none" stroke="#8b5cf6" stroke-width="2.5" opacity="0.9"/>
    <text x="60" y="45" text-anchor="middle" fill="#c4b5fd" font-family="monospace" font-size="13" font-weight="600">OUTBOX</text>
    <text x="60" y="68" text-anchor="middle" fill="#94a3b8" font-family="monospace" font-size="11">TABLE</text>
  </g>
  
  <!-- Arrow to broker -->
  <g transform="translate(680, 240)">
    <line x1="0" y1="20" x2="80" y2="20" stroke="url(#accent)" stroke-width="2.5"/>
    <polygon points="80,12 96,20 80,28" fill="#8b5cf6"/>
    <text x="48" y="10" text-anchor="middle" fill="#94a3b8" font-family="monospace" font-size="11">RELAY</text>
  </g>
  
  <!-- Message broker icon -->
  <g transform="translate(790, 195)">
    <rect x="0" y="0" width="130" height="110" rx="8" fill="none" stroke="#10b981" stroke-width="2.5" opacity="0.9"/>
    <text x="65" y="40" text-anchor="middle" fill="#6ee7b7" font-family="monospace" font-size="13" font-weight="600">KAFKA</text>
    <text x="65" y="62" text-anchor="middle" fill="#94a3b8" font-family="monospace" font-size="11">MQ</text>
    <!-- Signal waves -->
    <path d="M105,75 Q115,85 105,95" fill="none" stroke="#10b981" stroke-width="2" opacity="0.6"/>
    <path d="M115,70 Q130,85 115,100" fill="none" stroke="#10b981" stroke-width="2" opacity="0.4"/>
  </g>
  
  <!-- Top accent line -->
  <rect x="0" y="0" width="1200" height="3" fill="url(#accent)"/>
  
  <!-- Title -->
  <text x="600" y="420" text-anchor="middle" fill="#f1f5f9" font-family="'Segoe UI', system-ui, sans-serif" font-size="38" font-weight="700" letter-spacing="-0.5">
    Transactional Outbox
  </text>
  <text x="600" y="465" text-anchor="middle" fill="#94a3b8" font-family="'Segoe UI', system-ui, sans-serif" font-size="20" font-weight="400">
    Reliability for Payment Event Pipelines
  </text>
  
  <!-- Tags -->
  <g transform="translate(430, 500)">
    <rect x="0" y="0" width="70" height="26" rx="13" fill="none" stroke="#3b82f6" stroke-width="1.5" opacity="0.7"/>
    <text x="35" y="17" text-anchor="middle" fill="#60a5fa" font-family="'Segoe UI', system-ui, sans-serif" font-size="12">fintech</text>
    
    <rect x="80" y="0" width="90" height="26" rx="13" fill="none" stroke="#8b5cf6" stroke-width="1.5" opacity="0.7"/>
    <text x="125" y="17" text-anchor="middle" fill="#a78bfa" font-family="'Segoe UI', system-ui, sans-serif" font-size="12">architecture</text>
    
    <rect x="180" y="0" width="110" height="26" rx="13" fill="none" stroke="#10b981" stroke-width="1.5" opacity="0.7"/>
    <text x="235" y="17" text-anchor="middle" fill="#6ee7b7" font-family="'Segoe UI', system-ui, sans-serif" font-size="12">event-driven</text>
  </g>
  
  <!-- Author -->
  <text x="600" y="570" text-anchor="middle" fill="#475569" font-family="'Segoe UI', system-ui, sans-serif" font-size="14">Bio Lumbantoruan</text>
  
  <!-- Bottom accent line -->
  <rect x="0" y="627" width="1200" height="3" fill="url(#accent)"/>
</svg>