<svg width="1200" height="630" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1a1a2e"/>
      <stop offset="50%" style="stop-color:#16213e"/>
      <stop offset="100%" style="stop-color:#0f3460"/>
    </linearGradient>
    <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#61dafb"/>
      <stop offset="100%" style="stop-color:#f5a623"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="630" fill="url(#bg)"/>
  <rect x="0" y="0" width="1200" height="4" fill="url(#accent)"/>
  
  <!-- Server icon -->
  <rect x="280" y="220" rx="8" width="120" height="140" fill="none" stroke="#61dafb" stroke-width="3"/>
  <line x1="300" y1="260" x2="380" y2="260" stroke="#61dafb" stroke-width="2" opacity="0.6"/>
  <line x1="300" y1="290" x2="380" y2="290" stroke="#61dafb" stroke-width="2" opacity="0.6"/>
  <line x1="300" y1="320" x2="380" y2="320" stroke="#61dafb" stroke-width="2" opacity="0.6"/>
  <circle cx="370" cy="240" r="4" fill="#4ade80"/>
  
  <!-- Arrow -->
  <line x1="430" y1="290" x2="520" y2="290" stroke="#f5a623" stroke-width="3" stroke-dasharray="8,4"/>
  <polygon points="520,280 540,290 520,300" fill="#f5a623"/>
  
  <!-- React atom -->
  <circle cx="620" cy="290" r="12" fill="#61dafb"/>
  <ellipse cx="620" cy="290" rx="50" ry="18" fill="none" stroke="#61dafb" stroke-width="2" transform="rotate(-30, 620, 290)"/>
  <ellipse cx="620" cy="290" rx="50" ry="18" fill="none" stroke="#61dafb" stroke-width="2" transform="rotate(30, 620, 290)"/>
  <ellipse cx="620" cy="290" rx="50" ry="18" fill="none" stroke="#61dafb" stroke-width="2" transform="rotate(90, 620, 290)"/>
  
  <!-- Code bracket decoration -->
  <text x="760" y="300" font-family="monospace" font-size="48" fill="#61dafb" opacity="0.3">{ }</text>
  
  <!-- Title -->
  <text x="600" y="430" font-family="Arial, sans-serif" font-size="34" fill="#ffffff" text-anchor="middle" font-weight="bold">Server Components Rewired</text>
  <text x="600" y="472" font-family="Arial, sans-serif" font-size="34" fill="#ffffff" text-anchor="middle" font-weight="bold">My Data Fetching</text>
  
  <!-- Subtitle -->
  <text x="600" y="520" font-family="Arial, sans-serif" font-size="18" fill="#a0aec0" text-anchor="middle">From useEffect chains to async server components. What changed.</text>

  <!-- Author -->
  <text x="600" y="580" font-family="Arial, sans-serif" font-size="16" fill="#718096" text-anchor="middle">Bio Lumbantoruan · biotama.cv</text>

  <!-- Decorative dots -->
  <circle cx="100" cy="580" r="3" fill="#61dafb" opacity="0.5"/>
  <circle cx="120" cy="590" r="2" fill="#f5a623" opacity="0.4"/>
  <circle cx="1080" cy="100" r="3" fill="#61dafb" opacity="0.5"/>
  <circle cx="1100" cy="115" r="2" fill="#f5a623" opacity="0.4"/>
